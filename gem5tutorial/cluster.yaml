
cluster_name: gem5-extension-tutorial

connection: vpc

available_node_types:
    llm:
        resources: {"antigravity_creds": 1}
        num_workers: 1
        docker:
            image: "ghcr.io/ucb-bar/chia-antigravity:latest"
            container_name: "gem5_crypto_agy_llm_${USER}"
            run_options:
                - --ulimit nofile=65536:65536
                - --shm-size=10.24gb
                - "--user $(id -u):$(id -g)"
                - "-v ${HOME}/.gemini:/home/ray/.gemini" # agy OAuth token + config (MCP config is written here per call)
            run_setup_commands:
                - echo "user:x:$(id -u):$(id -g)::/home/ray:/bin/bash" >> /etc/passwd
        compatible_ips: ["${CHIA_HEAD}"]

    gem5_worker:
        resources: {"gem5": 1}
        num_workers: 1
        docker:
            image: "ghcr.io/ucb-bar/chia-gem5:latest"
            container_name: "g5gcp-worker-${USER}"
            pull_timeout: 3600
            run_options:
                - --ulimit nofile=65536:65536
                - --shm-size=32gb
                - "-e 'SCONSFLAGS=--max-drift=1 --implicit-cache --linker=lld'"
        worker_setup_commands:
                - "pip install pycryptodome"
                - "sudo apt-get update -qq && sudo apt-get install -y -qq lld binutils-riscv64-linux-gnu"
        compatible_ips: ["@gem5_gcp:0"]

gcp_nodes:
    project: ${GCP_PROJECT}
    zone: us-west4-c
    gem5_gcp:
        machine_type: c4-highcpu-24
        count: 1
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2204-lts
        disk_size_gb: 300              # gem5 image + build tree + workspaces + traces
        ssh_user: ubuntu               # user the guest agent creates on the VM
        ssh_private_key: ${HOME}/.ssh/chia-key

provider:
    head_ip: ${CHIA_HEAD}

auth:
    ssh_user: ${USER}

head_env_commands: ["source ~/.bashrc && conda activate chia_env"]

head_start_ray_commands:
    - ray stop --force
    - ulimit -c unlimited && ray start --head --port=6479 --include-dashboard=True --dashboard-port=8365 --ray-client-server-port=20101 --dashboard-agent-listen-port=52465 --temp-dir=/tmp/ray-${USER} --object-store-memory=2147483648

worker_start_ray_commands:
    - ray stop --force
    - ray start --address=$RAY_HEAD_IP:6479 --dashboard-agent-listen-port=0
