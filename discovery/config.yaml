# Native CHIA cluster layout plus the tutorial search controls.
# Fixed mounts, credentials, and evaluation policy are in backend.yaml.
# prepare expands run paths and worker indices; CPUS is the host CPU count.
cluster_name: dma-${NAME}
provider:
  head_ip: 127.0.0.1
auth:
  ssh_user: ${USER}
  ssh_private_key: ${HOME}/.ssh/id_ed25519

available_node_types:
  build:
    resources: {chipyard: 1}
    num_workers: 1
    compatible_ips: [127.0.0.1]
    docker:
      image: ghcr.io/ucb-bar/chia-chisel-build@sha256:9eca4dffdce51835005d5971864306d84fe46cc2dd2feb440521b98a14d84300
      container_name: dma-${NAME}-build
  simulation:
    resources:
      verilator_run: ${CPUS}
    num_workers: 1
    compatible_ips: [127.0.0.1]
    docker:
      image: ghcr.io/ucb-bar/chia-verilator-run@sha256:188e6ce07df32b8acaefede77fd4691e44da889a318527bf9eff047bb4c655c1
      container_name: dma-${NAME}-simulation
  generation:
    resources: {generation: 1}
    num_workers: 2
    compatible_ips: [127.0.0.1]
    docker:
      image: ${AGENT_IMAGE}
      container_name: dma-${NAME}-generation-${INDEX}

head_start_ray_commands:
- ray start --head --node-ip-address=127.0.0.1 --port=6387 --num-cpus=4 --dashboard-host=127.0.0.1
  --dashboard-port=8287 --temp-dir=/tmp/ray/dma-${NAME}
worker_start_ray_commands:
- /home/ray/anaconda3/bin/ray start --address=$RAY_HEAD_IP:6387 --num-cpus=$CHIA_CPUS --dashboard-agent-listen-port=0

runtime:
  ray_address: 127.0.0.1:6387
agent:
  backend: antigravity
  backends:
    antigravity:
      image: ghcr.io/ucb-bar/chia-antigravity@sha256:e4a1dfdcc9fea188667178311d47a2da7ac8dd150877f74748fce24b39329a0f
    codex:
      image: ghcr.io/ucb-bar/chia-claude-code@sha256:00e0817ddf405d0d6a79100ba81b76fa06050a6b84a0950cae534a83a54b74fe
    claude:
      image: ghcr.io/ucb-bar/chia-claude-code@sha256:00e0817ddf405d0d6a79100ba81b76fa06050a6b84a0950cae534a83a54b74fe
search:
  iterations: 2
  max_in_flight: 2
