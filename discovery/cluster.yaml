# Existing VMs from ../setup.md; this file never provisions cloud instances.
# Run prepare to render paths before passing deployment/cluster.yaml to chia up.
# The head is chia-dev; all five workers participate in simulation.
cluster_name: dma-${NAME}
connection: vpc
provider:
  head_ip: ${CHIA_HEAD}
auth:
  ssh_user: ${USER}
  ssh_private_key: ${HOME}/.ssh/chia-key

# Worker placement and containers. Generation can edit the entire /workspace.
# Verification has its own Ray node and no candidate workspace mount.
# run_options retain only required mounts and the workspace file owner.
available_node_types:
  build:
    resources:
      chipyard: 1
    num_workers: 1
    compatible_ips:
    - ${CHIA_HEAD}
    docker:
      image: ghcr.io/ucb-bar/chia-chisel-build:latest
      container_name: dma-${NAME}-build
      pull_before_run: true
      run_options:
      - --mount 'type=bind,src=${REMOTE}/chia_dma,dst=/opt/loop/chia_dma,readonly'
      - --mount 'type=bind,src=${SEED},dst=${SEED},readonly'
      pull_timeout: 7200
    worker_env_commands:
    - source /home/ray/chipyard/env.sh
    - export PATH=/home/ray/anaconda3/bin:/home/ray/chipyard/.conda-env/riscv-tools/bin:/home/ray/chipyard/.conda-env/bin:/usr/local/bin:/usr/bin:/bin
    - export PYTHONPATH=/opt/loop
    - export CHIA_CPUS=${CPUS}
    - export RISCV=/home/ray/chipyard/.conda-env/riscv-tools
    - export JAVA_TOOL_OPTIONS='-Xmx32G -Xss8M -Djava.io.tmpdir=/tmp -Duser.home=/home/ray'
    - export COURSIER_CACHE=/home/ray/.cache/coursier/v1
    worker_setup_commands:
    - python -c 'from chia_dma.source import initialize_checkout; initialize_checkout("/home/ray/dma-build", "${SEED}/tree")'
  software:
    resources: {riscv_build: 6}
    num_workers: 1
    compatible_ips: ["${CHIA_HEAD}"]
    docker:
      image: ghcr.io/ucb-bar/chia-riscv-cross:latest
      container_name: dma-${NAME}-software
      pull_timeout: 7200
      run_options:
      - --mount 'type=bind,src=${REMOTE}/chia_dma,dst=/opt/loop/chia_dma,readonly'
    worker_env_commands:
    - export PATH=/home/ray/conda/envs/riscv-tools/riscv-tools/bin:/home/ray/anaconda3/bin:/usr/local/bin:/usr/bin:/bin
    - export PYTHONPATH=/opt/loop
    - export CHIA_CPUS=6
  simulation:
    resources:
      verilator_run: ${CPUS}
    num_workers: 5
    compatible_ips:
    - chia-worker-1
    - chia-worker-2
    - chia-worker-3
    - chia-worker-4
    - chia-worker-5
    docker:
      image: ghcr.io/ucb-bar/chia-verilator-run:latest
      container_name: dma-${NAME}-simulation
      pull_before_run: true
      run_options:
      - --mount 'type=bind,src=${REMOTE}/chia_dma,dst=/opt/loop/chia_dma,readonly'
      pull_timeout: 7200
    worker_env_commands:
    - export PATH=/home/ray/anaconda3/bin:/usr/local/bin:/usr/bin:/bin
    - export PYTHONPATH=/opt/loop
    - export CHIA_CPUS=${CPUS}
    balance_level: worker
  generation:
    resources:
      generation: 1
    num_workers: 2
    compatible_ips:
    - ${CHIA_HEAD}
    docker:
      image: ghcr.io/ucb-bar/chia-antigravity:latest
      container_name: dma-${NAME}-generation-${INDEX}
      pull_before_run: true
      pull_timeout: 7200
      run_options:
      - --user ${UID}:${GID}
      - --mount 'type=bind,src=${REMOTE}/chia_dma,dst=/opt/loop/chia_dma,readonly'
      - --mount 'type=bind,src=${WORK},dst=/workspace'
      - --mount 'type=bind,src=${SEED}/tree,dst=/seed,readonly'
      - --mount 'type=bind,src=${CREDENTIALS},dst=/credentials,readonly'
    worker_env_commands:
    - export PATH=/home/ray/.local/bin:/home/ray/anaconda3/bin:/usr/local/bin:/usr/bin:/bin
    - export PYTHONPATH=/opt/loop
    - export CHIA_CPUS=2
    - export HOME=/tmp/agent-home
  verification:
    resources:
      verification: 1
    num_workers: 1
    compatible_ips:
    - ${CHIA_HEAD}
    docker:
      image: ghcr.io/ucb-bar/chia-verilator-run:latest
      container_name: dma-${NAME}-verification
      run_options:
      - --mount 'type=bind,src=${REMOTE}/chia_dma,dst=/opt/loop/chia_dma,readonly'
      pull_timeout: 7200
    worker_env_commands:
    - export PATH=/home/ray/anaconda3/bin:/usr/local/bin:/usr/bin:/bin
    - export PYTHONPATH=/opt/loop
    - export CHIA_CPUS=2

# Native CHIA synchronizes the loop's Python package; CHIA comes from each image.
# Source seeds and credentials stay on chia-dev; simulation inputs travel through Ray.
# CHIA/SSH resolve the worker names directly, as in the other tutorials.
initialization_commands:
- mkdir -p ${REMOTE}/chia_dma
file_mounts:
  ${REMOTE}/chia_dma: ${LOOP}/chia_dma/
rsync_exclude:
- __pycache__
- '*.pyc'
- .git
head_env_commands:
- source ~/.bashrc && conda activate chia_env
- export PYTHONPATH=${LOOP}
head_start_ray_commands:
- ray start --head --node-ip-address=${CHIA_HEAD} --port=6387 --num-cpus=4 --dashboard-host=0.0.0.0
  --dashboard-port=8287 --temp-dir=/tmp/ray/dma-${NAME}
worker_start_ray_commands:
- /home/ray/anaconda3/bin/ray start --address=$RAY_HEAD_IP:6387 --num-cpus=$CHIA_CPUS
  --dashboard-agent-listen-port=0

# Participant-facing loop controls; implementation defaults are in Python.
tutorial:
  agent:
    model: null             # null uses the authenticated AGY default
    effort: high
  search:
    iterations: 2           # total optimization proposals after the baseline
    max_in_flight: 2        # candidate rounds progressing concurrently

# Native CHIA cache/bypass controls.
cache:
  build: true
  build_program: true
  simulate: true
bypass:
  build: true
  build_program: true
  simulate: true
