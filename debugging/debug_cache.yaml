# Cache + bypass config for the debug section — run 1: fill the cache.
#
# Keys are the qualified function name (chialoops >= 2.0.1):
# RiscvBuildNode.build and ChiselBuildNode.build are both called "build", and
# a bare "build" key would hit both. The qualified name tells them apart.
#
# tags: are regexes over the call's _chia_tag (see debug_nodes.py).

cache:                                  # write path: real results go to disk
  RiscvBuildNode.build:
    cache: true
    tags: ["sw_.*"]
  ChiselBuildNode.build:
    cache: true
    tags: ["hw_.*"]
  VerilatorRunNode.run:
    cache: true
    tags: ["sim_.*"]

bypass: {}                              # read path: nothing replayed on run 1
