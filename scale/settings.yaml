# TUTORIAL SCALING KNOBS - CHANGE THESE VALUES
# VM sizes/counts live in cluster.yaml; Ray detects their CPU capacity.
agents: 1                     # Default active agents; five strategies below, subject to cluster capacity.
design_iterations_per_agent: 1 # Designs per agent; each can have up to four debug retries.
test_cases: 17              # Total test + benchmark cases; 0 selects all 4,488.
# One optimization prompt per agent; the first `agents` entries are used.
strategies:
  - Minimize setup and command overhead for small copies and unaligned tails.
  - Maximize bulk throughput using pipelined requests and multiple outstanding operations.
  - Improve cache-line transfers, ordering, and completion latency.
  - Optimize differently aligned source and destination addresses using a sliding-window data realigner and masked edge writes.
  - Decouple reads and writes with a small FIFO to hide memory latency and tolerate backpressure.



# MODEL SETTINGS - SEPARATE FROM SCALING
model: gemini-4-argon-medium  # Enterprise model; verify project access with `agy models`.
model_effort: medium         # Explicit medium effort; default omits --effort.



# FIXED PARAMETERS - DO NOT CHANGE FOR THIS TUTORIAL
# Leave the defaults below unchanged when experimenting with scaling.
chipyard_path: /home/ray/chipyard
hardware_config: FastRTLSimRocketConfig
simulation_threads: 1         # Ray CPUs requested by each simulation.
quick_cases_per_kind: 32      # Subset of the upstream tests AND benchmarks.
max_case_bytes: 16384         # Retain large-copy coverage in the available corpus.
cases_per_binary: 8           # Maximum, not a fixed batch size.
batch_work_bytes: 98304       # Cap sum((length + 128 guard bytes) * invocations).
benchmark_repeats: 1          # One timed copy per benchmark.
benchmark_warmups: 1
max_attempts: 5               # Initial design + up to four debugging attempts.
debug_feedback_max_chars: 4000 # Error excerpt sent to AI; full logs stay on disk.
compile_timeout_seconds: 300
build_timeout_seconds: 14400
simulation_timeout_seconds: 1200 # 20-minute wall-clock limit per simulation batch.
simulation_timeout_cycles: 50000000
model_timeout_seconds: 3600
model_rate_limit_retries: 2   # Additional attempts for genuinely failed 429s.
model_backoff_seconds: 30     # Wait 30s, then 60s (or provider delay if longer).
model_max_backoff_seconds: 120 # Stop if the provider asks for a longer wait; never retry early.
ray_address: auto
