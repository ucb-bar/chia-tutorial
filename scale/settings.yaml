# TUTORIAL: fill in these values; VM sizes/counts live in cluster.yaml.
agents: 3                     # One dedicated builder/model session each; match cluster capacity.
iterations_per_agent: 1        # Start small; each iteration can have debug retries.
strategies:
  - Minimize setup and command overhead for small copies and unaligned tails.
  - Maximize bulk throughput using pipelined requests and multiple outstanding operations.
  - Improve cache-line transfers, ordering, and completion latency.
model: gemini-4-argon-medium  # Enterprise model; verify project access with `agy models`.
model_effort: medium         # TUTORIAL: explicit medium effort; default omits --effort.
chipyard_path: /home/ray/chipyard
hardware_config: FastRTLSimRocketConfig
build_jobs: 24                # Keep <= builder Ray CPUs (24 in cluster.yaml).
java_heap_gb: 8               # TUTORIAL: SBT/Chisel JVM heap per builder.
simulation_threads: 1         # Also consumes this many verilator_run slots.
compile_slots: 4              # Keep <= riscv_build tokens in cluster.yaml.
simulation_slots: 48          # Keep <= total verilator_run tokens in cluster.yaml.
quick_cases_per_kind: 32      # Subset of the upstream tests AND benchmarks.
max_case_bytes: 16384         # Retain large-copy coverage in the available corpus.
test_cases: 1024              # TUTORIAL: total test + benchmark cases; 0 selects all 4,488.
cases_per_binary: 8           # TUTORIAL: maximum, not a fixed batch size.
batch_work_bytes: 98304       # TUTORIAL: cap sum((length + 128 guard bytes) * invocations).
benchmark_repeats: 1          # One timed copy per benchmark.
benchmark_warmups: 1
max_attempts: 5               # Initial design + up to four debugging attempts.
debug_feedback_max_chars: 4000 # TUTORIAL: error excerpt sent to AI; full logs stay on disk.
compile_timeout_seconds: 300
build_timeout_seconds: 14400
simulation_timeout_seconds: 1200 # TUTORIAL: 20-minute wall-clock limit per simulation batch.
simulation_timeout_cycles: 50000000
model_timeout_seconds: 3600
model_rate_limit_retries: 2   # TUTORIAL: additional attempts for genuinely failed 429s.
model_backoff_seconds: 30     # TUTORIAL: wait 30s, then 60s (or provider delay if longer).
model_max_backoff_seconds: 120 # Stop if the provider asks for a longer wait; never retry early.
metrics_interval_seconds: 5
ray_address: auto
